name: ED DU V16 integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize production bridge and payment stack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '</body>' not in s:
              raise SystemExit('index.html sem </body>')
          script_urls = [
              'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
              './v16.js',
              './v46-command-center.js',
              './v50-smart-gateway.js',
              './v53-production-authority.js',
              './v54-command-gateway-bridge.js',
              './v55-production-hardening.js',
          ]
          for url in script_urls:
              s = re.sub(r'<script\s+src=["\']' + re.escape(url) + r'["\']\s*></script>\s*', '', s)
          boot_css = '<style id="eddu-production-boot">#root{visibility:hidden}</style>\n'
          s = re.sub(r'<style id="eddu-production-boot">.*?</style>\s*', '', s, flags=re.S)
          s = s.replace('</head>', boot_css + '</head>', 1)
          tags = ''.join(f'<script src="{url}"></script>\n' for url in script_urls)
          s = s.replace('</body>', tags + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit normalized integration
        shell: bash
        run: |
          git config user.name "ED DU Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V55.2: normalize production script stack"
          git push
