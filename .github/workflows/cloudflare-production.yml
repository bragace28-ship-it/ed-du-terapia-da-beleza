name: ED DU Cloudflare Production

on:
  push:
    branches: [cloudflare-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved V33
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate immutable V33
        run: npm run check

      - name: Build approved V33
        env:
          CF_PAGES_BRANCH: cloudflare-production
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=cloudflare-production --commit-hash="${GITHUB_SHA}" --commit-message="Deploy approved V33"

      - name: Verify release identity
        run: cat dist/version.json
