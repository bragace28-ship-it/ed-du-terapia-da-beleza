name: ED DU Cloudflare Production

on:
  push:
    branches: [cloudflare-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved V33
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate immutable V33
        run: npm run check

      - name: Build approved V33
        env:
          CF_PAGES_BRANCH: cloudflare-production
        run: npm run build

      - name: Make cloudflare-production the Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ed-du-terapia-da-beleza" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"cloudflare-production"}' \
            | tee /tmp/cf-project.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cf-project.json'))
          assert d.get('success') is True, d
          print('Cloudflare production_branch = cloudflare-production')
          PY

      - name: Deploy approved V33 as production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@latest pages deploy dist \
            --project-name=ed-du-terapia-da-beleza \
            --branch=cloudflare-production \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy approved V33 production"

      - name: Remove obsolete Cloudflare Pages deployments
        run: |
          set -euo pipefail
          npx wrangler@latest pages deployment list \
            --project-name=ed-du-terapia-da-beleza \
            --json > /tmp/deployments.json

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/deployments.json'))
          if not d:
              raise SystemExit('No deployment returned after production deploy')
          print('Deployments returned:', len(d))
          print('Keeping newest deployment:', d[0].get('id') or d[0].get('Id'))
          for item in d[1:]:
              ident=item.get('id') or item.get('Id')
              if ident:
                  print('DELETE', ident)
          PY

          python3 - <<'PY' > /tmp/old_ids.txt
          import json
          d=json.load(open('/tmp/deployments.json'))
          for item in d[1:]:
              ident=item.get('id') or item.get('Id')
              if ident:
                  print(ident)
          PY

          while IFS= read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting obsolete deployment $id"
            npx wrangler@latest pages deployment delete "$id" \
              --project-name=ed-du-terapia-da-beleza \
              --force || echo "Cloudflare retained $id (for example, latest deployment of a branch)."
          done < /tmp/old_ids.txt

      - name: Verify release identity
        run: cat dist/version.json
