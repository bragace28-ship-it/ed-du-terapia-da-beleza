name: ED DU Cloudflare Production

on:
  push:
    branches: [cloudflare-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved V33
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Validate immutable V33
        run: npm run check

      - name: Build approved V33
        env:
          CF_PAGES_BRANCH: cloudflare-production
        run: npm run build

      - name: Make cloudflare-production the Pages production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ed-du-terapia-da-beleza" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"production_branch":"cloudflare-production"}' > /tmp/cf-project.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cf-project.json'))
          assert d.get('success') is True, d
          print('Cloudflare production_branch = cloudflare-production')
          PY

      - name: Deploy approved V33 as production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler@latest pages deploy dist \
            --project-name=ed-du-terapia-da-beleza \
            --branch=cloudflare-production \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Deploy approved V33 production"

      - name: Verify production URL is the approved V33
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://ed-du-terapia-da-beleza.pages.dev/version.json?release=${GITHUB_SHA}" \
            -o /tmp/live-version.json
          cat /tmp/live-version.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/live-version.json'))
          assert d.get('version') == '33.0.0', d
          assert d.get('visualBaseline') == 'IMMUTABLE-V33', d
          assert d.get('gitBlobSha') == '6cb8a4d8b1c9471938c861016b2691c240b4ac15', d
          assert d.get('sha256') == '56c09e2a0bb50e0cd904103fe58f096427ff4f47db2c4bd1499342aa25532e0d', d
          print('LIVE APPROVED V33 VERIFIED')
          PY

      - name: Remove obsolete Cloudflare Pages deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse

          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          project='ed-du-terapia-da-beleza'
          keep_sha=os.environ['GITHUB_SHA']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/{project}/deployments'

          def req(url, method='GET'):
              r=urllib.request.Request(url, method=method, headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json',
              })
              with urllib.request.urlopen(r, timeout=60) as resp:
                  return json.load(resp)

          deployments=[]
          for env in ('production','preview'):
              page=1
              while True:
                  qs=urllib.parse.urlencode({'env':env,'page':page,'per_page':20})
                  data=req(base+'?'+qs)
                  if not data.get('success'):
                      raise SystemExit(data)
                  batch=data.get('result') or []
                  deployments.extend(batch)
                  info=data.get('result_info') or {}
                  total_pages=int(info.get('total_pages', page))
                  if not batch or page >= total_pages:
                      break
                  page += 1

          keep=None
          for d in deployments:
              meta=((d.get('deployment_trigger') or {}).get('metadata') or {})
              if meta.get('commit_hash') == keep_sha and d.get('environment') == 'production':
                  keep=d
                  break

          if not keep:
              raise SystemExit('Approved production deployment not found in Cloudflare API')

          keep_id=keep.get('id')
          print('Preserving approved production deployment:', keep_id)

          retained=0
          deleted=0
          for d in deployments:
              ident=d.get('id')
              if not ident or ident == keep_id:
                  continue
              url=base+'/'+urllib.parse.quote(ident, safe='')+'?force=true'
              try:
                  out=req(url, method='DELETE')
                  if out.get('success'):
                      deleted += 1
                      print('DELETED', ident, d.get('environment'), d.get('deployment_trigger',{}).get('metadata',{}).get('branch'))
                  else:
                      retained += 1
                      print('RETAINED', ident, out)
              except Exception as e:
                  retained += 1
                  print('RETAINED', ident, str(e))

          print(f'Cloudflare cleanup complete. deleted={deleted} retained={retained} preserved={keep_id}')
          PY

      - name: Verify release identity
        run: cat dist/version.json
