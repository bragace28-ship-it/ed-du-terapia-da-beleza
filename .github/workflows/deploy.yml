name: ED DU V33 Cloudflare Pages Deploy
on:
  push:
    branches: [cloudflare-production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate approved master
        run: npm run check
      - name: Build approved master
        run: npm run build
      - name: Stamp deployment metadata
        run: |
          printf '{"version":"33.0.0","commit":"%s"}\n' "${GITHUB_SHA:0:8}" > dist/version.json
          test -f dist/index.html
          test -f dist/_redirects
          grep -Fxq '/* /index.html 200' dist/_redirects
          ! grep -R -E 'supabase\.co|VITE_SUPABASE|@supabase' dist
      - name: Deploy with Wrangler when authorized
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ./dist --project-name=ed-du-terapia-da-beleza --branch=cloudflare-production --commit-hash="$GITHUB_SHA"
      - name: Verify public publication
        run: |
          set -euo pipefail
          for i in {1..12}; do
            BODY="$(curl -fsSL --retry 2 --retry-all-errors https://ed-du-terapia-da-beleza.pages.dev/version.json || true)"
            echo "Attempt $i: $BODY"
            if echo "$BODY" | grep -q '"version":"33.0.0"'; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: HTTP smoke test
        run: curl -fsSL --retry 3 --retry-all-errors https://ed-du-terapia-da-beleza.pages.dev/ | grep -F 'ED & DU'