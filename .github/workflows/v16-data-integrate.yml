name: ED DU V29 application integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject application layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for src in ('./v16-data.js','./v16-clinical.js','./v16-clinical-ui.js','./v16-finance.js','./v16-storage.js','./v17-finalize.js','./v17-client-payment.js','./v18-real-payment.js','./v20-auth-profile.js','./v21-production-data.js','./v22-operational-sync.js','./v23-reconciliation.js','./v24-financial-center.js','./v25-pix-reconciliation.js','./v26-pagbank-checkout.js','./v27-pagbank-ui.js','./v28-auth-fix.js','./v29-command-save.js'):
              tag=f'<script src="{src}"></script>\n'
              if src not in s:
                  if '</body>' not in s: raise SystemExit('index.html sem </body>')
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          test -f index.html
          for f in v16-data.js v16-clinical.js v16-clinical-ui.js v16-finance.js v16-storage.js v17-finalize.js v17-client-payment.js v18-real-payment.js v20-auth-profile.js v21-production-data.js v22-operational-sync.js v23-reconciliation.js v24-financial-center.js v25-pix-reconciliation.js v26-pagbank-checkout.js v27-pagbank-ui.js v28-auth-fix.js v29-command-save.js; do
            test -f "$f"
            grep -q "$f" index.html
            node --check "$f"
          done
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ED DU Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V29: corrigir persistência das comandas"
          git push
