name: ED DU V16 data integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject application layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for src in ('./v16-data.js','./v16-clinical.js','./v16-clinical-ui.js','./v16-finance.js','./v16-storage.js'):
              tag=f'<script src="{src}"></script>\n'
              if src not in s:
                  if '</body>' not in s: raise SystemExit('index.html sem </body>')
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          test -f index.html
          test -f v16-data.js
          test -f v16-clinical.js
          test -f v16-clinical-ui.js
          test -f v16-finance.js
          test -f v16-storage.js
          grep -q 'v16-data.js' index.html
          grep -q 'v16-clinical.js' index.html
          grep -q 'v16-clinical-ui.js' index.html
          grep -q 'v16-finance.js' index.html
          grep -q 'v16-storage.js' index.html
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ED DU Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V16.8: integrar armazenamento clinico"
          git push
