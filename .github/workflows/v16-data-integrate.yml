name: ED DU V16 data integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject data layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          tag='<script src="./v16-data.js"></script>\n'
          if './v16-data.js' not in s:
              if '</body>' not in s: raise SystemExit('index.html sem </body>')
              s=s.replace('</body>',tag+'</body>',1); p.write_text(s,encoding='utf-8')
          PY
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ED DU Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V16.3: integrar persistência Supabase"
          git push