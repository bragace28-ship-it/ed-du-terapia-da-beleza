name: ED DU V43 command portal
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V43
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          src='./v43-command-portal.js'
          tag=f'<script src="{src}"></script>\n'
          if src not in s:
              s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          test -f v43-command-portal.js
          grep -q 'v43-command-portal.js' index.html
          node --check v43-command-portal.js
      - name: Commit
        run: |
          git config user.name "ED DU Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V43: portal independente"
          git push
