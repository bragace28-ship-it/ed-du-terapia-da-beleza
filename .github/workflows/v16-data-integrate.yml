name: ED DU V50 command center
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production stack
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f v46-command-center.js
          test -f v50-smart-gateway.js
          test -f v53-production-authority.js
          test -f v54-command-gateway-bridge.js
          test -f v55-production-hardening.js
          test -f v56-role-safety.js
          grep -q 'v46-command-center.js' index.html
          grep -q 'v50-smart-gateway.js' index.html
          grep -q 'v53-production-authority.js' index.html
          grep -q 'v54-command-gateway-bridge.js' index.html
          grep -q 'v55-production-hardening.js' index.html
          grep -q 'v56-role-safety.js' index.html
