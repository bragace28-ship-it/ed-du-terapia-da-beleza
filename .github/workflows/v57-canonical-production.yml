name: ED DU Canonical Production Validator
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical production stack
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          for f in v16.js v46-command-center.js v50-smart-gateway.js v53-production-authority.js v54-command-gateway-bridge.js v55-production-hardening.js v56-role-safety.js v58-production-runtime-guard.js; do
            test -f "$f"
          done

          python - <<'PY'
          from pathlib import Path
          import re

          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'v16.js',
              'v46-command-center.js',
              'v50-smart-gateway.js',
              'v53-production-authority.js',
              'v54-command-gateway-bridge.js',
              'v55-production-hardening.js',
              'v56-role-safety.js',
              'v58-production-runtime-guard.js',
          ]

          positions = []
          for name in required:
              tags = re.findall(r'<script[^>]+src=[\"\'](?:\\./)?' + re.escape(name) + r'[\"\'][^>]*>\\s*</script>', s, flags=re.I)
              if len(tags) != 1:
                  raise SystemExit(f'{name}: expected exactly one script tag, found {len(tags)}')
              positions.append(s.index(tags[0]))

          if positions != sorted(positions):
              raise SystemExit('Canonical script order is invalid')

          if 'id="eddu-production-boot"' not in s:
              raise SystemExit('Production boot gate is missing')

          print('Canonical production stack: OK')
          PY
