name: ED DU Master V46 Final Homologation

on:
  push:
    branches: [master-v46-final-homologation-2026-09-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master V46 final
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate V33 and Master V46
        run: |
          npm run check
          npm run master:check
      - name: Build Master V46 + Neon bridge
        env:
          MASTER_DEPLOY: '1'
        run: npm run build
      - name: Release identity
        run: cat dist/version.json
      - name: Verify release files
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/_routes.json
          grep -q '"version": "46.0.0"' dist/version.json
          grep -q '"runtimeArtifact": "MASTER-V46"' dist/version.json
      - name: Configure gateway secrets on Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          PAGBANK_TOKEN: ${{ secrets.PAGBANK_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PICPAY_CLIENT_ID: ${{ secrets.PICPAY_CLIENT_ID }}
          PICPAY_CLIENT_SECRET: ${{ secrets.PICPAY_CLIENT_SECRET }}
          PICPAY_WEBHOOK_TOKEN: ${{ secrets.PICPAY_WEBHOOK_TOKEN }}
          NUPAY_MERCHANT_KEY: ${{ secrets.NUPAY_MERCHANT_KEY }}
          NUPAY_MERCHANT_TOKEN: ${{ secrets.NUPAY_MERCHANT_TOKEN }}
        run: |
          set -e
          put_secret() { name="$1"; value="$2"; if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler@latest pages secret put "$name" --project-name=ed-du-terapia-da-beleza; else echo "SKIP $name (GitHub secret not configured)"; fi; }
          put_secret NEON_DATABASE_URL "$NEON_DATABASE_URL"
          put_secret ASAAS_API_KEY "$ASAAS_API_KEY"
          put_secret ASAAS_WEBHOOK_TOKEN "$ASAAS_WEBHOOK_TOKEN"
          put_secret PAGBANK_TOKEN "$PAGBANK_TOKEN"
          put_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          put_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          put_secret PICPAY_CLIENT_ID "$PICPAY_CLIENT_ID"
          put_secret PICPAY_CLIENT_SECRET "$PICPAY_CLIENT_SECRET"
          put_secret PICPAY_WEBHOOK_TOKEN "$PICPAY_WEBHOOK_TOKEN"
          put_secret NUPAY_MERCHANT_KEY "$NUPAY_MERCHANT_KEY"
          put_secret NUPAY_MERCHANT_TOKEN "$NUPAY_MERCHANT_TOKEN"
      - name: Deploy Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=master-v46-final-homologation-2026-09-30 --commit-hash="${GITHUB_SHA}" --commit-message="Master V46 + Neon bridge"
      - name: Verify Cloudflare Neon health
        run: |
          sleep 5
          curl --fail --silent --show-error https://master-v46-final-homologation-2026-09-30.ed-du-terapia-da-beleza.pages.dev/api/health | tee /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"service":"neon"' /tmp/health.json"