name: ED DU Master V46 Final Homologation

on:
  push:
    branches: [master-v46-final-homologation-2026-09-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master V46 final
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate V33 and Master V46
        run: |
          npm run check
          npm run master:check
      - name: Validate 86-item Master V46 matrix
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("master/FEATURE_MATRIX_86.json").read_text())
          ids=[str(x.get("id","")) for x in m.get("items",[])]
          assert m.get("count")==86
          assert len(m.get("items",[]))==86
          assert len(set(ids))==86
          assert m.get("artifact")=="MASTER-V46"
          assert m.get("visualBaseline")=="IMMUTABLE-V33"
          print("FEATURE_MATRIX_86: PASS — 86/86 — MASTER-V46 — IMMUTABLE-V33")
          PY
      - name: Build Master V46 + Neon bridge
        env:
          MASTER_DEPLOY: '1'
        run: npm run build
      - name: Release identity
        run: cat dist/version.json
      - name: Verify release files
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/_routes.json
          grep -q '"version": "46.0.0"' dist/version.json
          grep -q '"runtimeArtifact": "MASTER-V46"' dist/version.json
      - name: Deploy Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler@latest pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=master-v46-preview --commit-hash="${GITHUB_SHA}" --commit-message="Master V46 + Neon bridge" 2>&1 | tee /tmp/deploy.log
      - name: Resolve deployed Cloudflare URL
        run: |
          node <<'NODE'
          const fs = require('fs');
          const url = 'https://master-v46-preview.ed-du-terapia-da-beleza.pages.dev';
          fs.writeFileSync('/tmp/deployment-url.txt', url);
          console.log('Resolved Cloudflare deployment URL: ' + url);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Cloudflare Preview\\n\\n**Resolved deployment URL:** ' + url + '\\n');
          NODE
      - name: Verify Cloudflare Neon health
        run: |
          URL="$(cat /tmp/deployment-url.txt)"
          rm -f /tmp/health.json
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$URL/api/health" | tee /tmp/health.json; then
              break
            fi
            sleep 5
          done
          test -s /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"service":"neon"' /tmp/health.json
      - name: Verify deployed release identity
        run: |
          URL="$(cat /tmp/deployment-url.txt)"
          curl --fail --silent --show-error "$URL/version.json" | tee /tmp/version.json
          grep -q '"version": "46.0.0"' /tmp/version.json
          grep -q '"runtimeArtifact": "MASTER-V46"' /tmp/version.json
          printf '\n**Release identity:** V46.0.0 / MASTER-V46\\n' >> "$GITHUB_STEP_SUMMARY"