name: ED DU Master V46 Final Homologation

on:
  push:
    branches: [master-v46-final-homologation-2026-09-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master V46 final
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate V33 and Master V46
        run: |
          npm run check
          npm run master:check
      - name: Build Master V46 + Neon bridge
        env:
          MASTER_DEPLOY: '1'
        run: npm run build
      - name: Release identity
        run: cat dist/version.json
      - name: Verify release files
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/_routes.json
          grep -q '"version": "46.0.0"' dist/version.json
          grep -q '"runtimeArtifact": "MASTER-V46"' dist/version.json
      - name: Deploy Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=master-v46-final-homologation-2026-09-30 --commit-hash="${GITHUB_SHA}" --commit-message="Master V46 + Neon bridge"
      - name: Resolve deployed Cloudflare URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deployment list --project-name=ed-du-terapia-da-beleza --json > /tmp/deployments.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/deployments.json', 'utf8'));
          const deployments = Array.isArray(data) ? data : (data.result || data.deployments || []);
          const target = deployments.find((d) => {
            const meta = d.deployment_trigger?.metadata || d.deploymentTrigger?.metadata || {};
            return meta.commit_hash === process.env.GITHUB_SHA ||
              meta.commitHash === process.env.GITHUB_SHA ||
              d.commit_hash === process.env.GITHUB_SHA ||
              d.commitHash === process.env.GITHUB_SHA;
          });
          if (!target) {
            console.error('No Cloudflare Pages deployment found for commit ' + process.env.GITHUB_SHA);
            process.exit(1);
          }
          const url = target.url || target.URL || target.preview_url || target.previewUrl;
          if (!url) {
            console.error('Cloudflare deployment found but no live URL was returned.');
            process.exit(1);
          }
          fs.writeFileSync('/tmp/deployment-url.txt', url);
          console.log('Resolved Cloudflare deployment URL: ' + url);
          console.log('Aliases: ' + JSON.stringify(target.aliases || target.Aliases || []));
          NODE
      - name: Verify Cloudflare Neon health
        run: |
          URL="$(cat /tmp/deployment-url.txt)"
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$URL/api/health" | tee /tmp/health.json; then
              break
            fi
            sleep 5
          done
          test -s /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"service":"neon"' /tmp/health.json
      - name: Verify deployed release identity
        run: |
          URL="$(cat /tmp/deployment-url.txt)"
          curl --fail --silent --show-error "$URL/version.json" | tee /tmp/version.json
          grep -q '"version": "46.0.0"' /tmp/version.json
          grep -q '"runtimeArtifact": "MASTER-V46"' /tmp/version.json