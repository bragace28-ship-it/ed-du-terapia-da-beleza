name: ED DU Master V46 Final Homologation

on:
  push:
    branches: [master-v46-final-homologation-2026-09-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master V46 final
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate V33 and Master V46
        run: |
          npm run check
          npm run master:check
      - name: Build Master V46 + Neon bridge
        env:
          MASTER_DEPLOY: '1'
        run: npm run build
      - name: Release identity
        run: cat dist/version.json
      - name: Verify release files
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -f dist/_routes.json
          grep -q '"version": "46.0.0"' dist/version.json
          grep -q '"runtimeArtifact": "MASTER-V46"' dist/version.json
      - name: Deploy Cloudflare preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=master-v46-final-homologation-2026-09-30 --commit-hash="${GITHUB_SHA}" --commit-message="Master V46 + Neon bridge" 2>&1 | tee /tmp/deploy.log
      - name: Resolve deployed Cloudflare URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail --silent --show-error \\
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \\
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ed-du-terapia-da-beleza/deployments?env=preview&per_page=20" \\
            > /tmp/deployments.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/deployments.json', 'utf8'));
          if (!data.success) throw new Error('Cloudflare API returned success=false: ' + JSON.stringify(data.errors));
          const deployments = Array.isArray(data.result) ? data.result : [];
          const sha = process.env.GITHUB_SHA;
          const branch = 'master-v46-final-homologation-2026-09-30';
          const matching = deployments.filter(d =>
            d?.deployment_trigger?.metadata?.commit_hash === sha &&
            d?.deployment_trigger?.metadata?.branch === branch
          );
          const d = matching[0] || deployments.find(x => x?.deployment_trigger?.metadata?.commit_hash === sha) || deployments[0];
          if (!d) throw new Error('No Cloudflare preview deployment found.');
          const url = d.url || (Array.isArray(d.aliases) ? d.aliases[0] : null);
          if (!url) throw new Error('Cloudflare deployment has no live URL.');
          fs.writeFileSync('/tmp/deployment-url.txt', url);
          console.log('Resolved Cloudflare deployment URL: ' + url);
          console.log('Deployment ID: ' + (d.id || 'unknown'));
          console.log('Deployment commit: ' + (d.deployment_trigger?.metadata?.commit_hash || 'unknown'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Cloudflare Preview\\n\\n**Resolved deployment URL:** ' + url + '\\n');
          NODE
      - name: Verify Cloudflare Neon health
        run: |
          URL="$(cat /tmp/deployment-url.txt)"
          rm -f /tmp/health.json
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$URL/api/health" | tee /tmp/health.json; then
              break
            fi
            sleep 5
          done
          test -s /tmp/health.json
          grep -q '"ok":true' /tmp/health.json
          grep -q '"service":"neon"' /tmp/health.json
      - name: Verify deployed release identity
        run: |
          URL="$(cat /tmp/deployment-url.txt)"
          curl --fail --silent --show-error "$URL/version.json" | tee /tmp/version.json
          grep -q '"version": "46.0.0"' /tmp/version.json
          grep -q '"runtimeArtifact": "MASTER-V46"' /tmp/version.json
          printf '\n**Release identity:** V46.0.0 / MASTER-V46\\n' >> "$GITHUB_STEP_SUMMARY"