name: ED DU V16 clinical finance integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V16.6 modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=['<script src="./v16-clinical.js"></script>\n','<script src="./v16-finance.js"></script>\n']
          for tag in tags:
              if tag.split('src="./')[1].split('"')[0] not in s:
                  s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          test -f index.html
          grep -q 'v16-clinical.js' index.html
          grep -q 'v16-finance.js' index.html
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "ED DU Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V16.6: integrar clinico e financeiro"
          git push
