name: ED DU Clinical validation
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production modules
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f v16-clinical.js
          test -f v16-finance.js
          test -f v16-storage.js
          test -f v53-production-authority.js
          test -f v55-production-hardening.js
          test -f v56-role-safety.js
