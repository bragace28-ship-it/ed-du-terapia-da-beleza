name: ED DU Master V46 Preview

on:
  push:
    branches: [master-v46-implementation-2026-09-25]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master V46
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate immutable V33 + Master V46
        run: |
          npm run check
          npm run master:check

      - name: Build Master V46
        env:
          MASTER_DEPLOY: '1'
        run: npm run build

      - name: Deploy Master V46 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=master-v46-implementation-2026-09-25 --commit-hash="${GITHUB_SHA}" --commit-message="Master V46 preview"

      - name: Release identity
        run: cat dist/version.json
