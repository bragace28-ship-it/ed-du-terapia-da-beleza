name: ED DU Master V46 Preview

on:
  push:
    branches: [master-v46-final-homologation-2026-09-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master V46
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate V33 lock + Master 86
        run: |
          npm run check
          npm run master:check
      - name: Build Master V46
        env:
          MASTER_DEPLOY: '1'
        run: npm run build
      - name: Validate release identity
        run: cat dist/version.json
      - name: Configure Neon secret on preview
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$NEON_DATABASE_URL"
          printf '%s' "$NEON_DATABASE_URL" | npx wrangler@latest pages secret put NEON_DATABASE_URL --project-name=ed-du-terapia-da-beleza
          test -n "$ASAAS_API_KEY"
          printf '%s' "$ASAAS_API_KEY" | npx wrangler@latest pages secret put ASAAS_API_KEY --project-name=ed-du-terapia-da-beleza
      - name: Deploy Master V46 preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=master-v46-final-homologation-2026-09-30 --commit-hash="${GITHUB_SHA}" --commit-message="Master V46 preview"