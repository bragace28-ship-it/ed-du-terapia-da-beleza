name: ED DU Master V46 Preview

on:
  push:
    branches: [master-v46-final-homologation-2026-09-30]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Master V46
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate V33 lock + Master 86
        run: |
          npm run check
          npm run master:check
      - name: Build Master V46
        env:
          MASTER_DEPLOY: '1'
        run: npm run build
      - name: Validate release identity
        run: cat dist/version.json
"