name: Master V46 Browser E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install application dependencies
        run: npm install

      - name: Validate and build canonical Master
        run: |
          npm run master:check
          npm run build
          npm run test

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Serve built artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/eddu-e2e-http.log 2>&1 &
          echo $! > /tmp/eddu-e2e-http.pid
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/version.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/version.json
          curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/dev/null

      - name: Run mobile browser smoke tests
        run: npx playwright test tests/e2e/master-smoke.spec.cjs --reporter=list
        env:
          CI: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: master-v46-playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/eddu-e2e-http.log
          if-no-files-found: ignore
