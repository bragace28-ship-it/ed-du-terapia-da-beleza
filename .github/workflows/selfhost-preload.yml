name: ED DU self-host preload
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert self-host preload without changing layout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          preload='<script src="./eddu-selfhost-preload.js"></script>'
          if preload not in s:
              if marker not in s:
                  raise SystemExit('Supabase CDN marker not found; refusing to change layout')
              s=s.replace(marker, marker+'\n'+preload, 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit only the preload insertion
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Prepare frontend for self-hosted Supabase'
          git push
