name: ED DU Self-Hosted Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build --pull -t eddu:self-hosted-ci .

      - name: Verify Docker image metadata
        run: docker image inspect eddu:self-hosted-ci >/dev/null
