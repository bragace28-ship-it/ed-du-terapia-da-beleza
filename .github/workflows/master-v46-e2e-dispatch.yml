name: ED DU Master V46 E2E Dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  deployments: write

jobs:
  e2e-preview:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.body == '/run-e2e' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Validate Master V46
        run: |
          npm run check
          npm run master:check
      - name: Build Master V46
        env:
          MASTER_DEPLOY: '1'
        run: npm run build
      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ed-du-terapia-da-beleza --branch=master-v46-e2e --commit-hash=${{ github.sha }} --commit-message="Master V46 E2E preview"
