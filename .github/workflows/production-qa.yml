name: ED DU Production QA
on:
  push:
    branches: [cloudflare-production]
  pull_request:
    branches: [cloudflare-production]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HOMOLOG_READY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.HOMOLOG_USER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Assert production artifact
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          grep -Fxq '/* /index.html 200' dist/_redirects
          ! grep -R -E 'V13\.1|V15|Mariana|Juliana|Camila|R\$ 8\.532,00|modo de teste|modo teste' dist
      - name: Provision authenticated homologation user
        if: ${{ env.HOMOLOG_READY == 'true' }}
        env:
          SUPABASE_URL: https://cwdpwfzsasdsetthmpoa.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HOMOLOG_USER_PASSWORD: ${{ secrets.HOMOLOG_USER_PASSWORD }}
          HOMOLOG_USER_EMAIL: admin.homologacao@ededuterapiadabeleza.online
        run: node --experimental-strip-types scripts/create_homolog_user.ts
      - name: Install Playwright for production E2E
        if: ${{ env.HOMOLOG_READY == 'true' }}
        run: npx --yes @playwright/test@1.55.0 install --with-deps chromium
      - name: Run authenticated production E2E
        if: ${{ env.HOMOLOG_READY == 'true' }}
        env:
          HOMOLOG_USER_PASSWORD: ${{ secrets.HOMOLOG_USER_PASSWORD }}
          HOMOLOG_USER_EMAIL: admin.homologacao@ededuterapiadabeleza.online
          E2E_BASE_URL: https://ed-du-terapia-da-beleza.pages.dev/
        run: npx --yes @playwright/test@1.55.0 tests/e2e/production.spec.ts --reporter=list
      - name: Upload production E2E artifacts
        if: ${{ always() && env.HOMOLOG_READY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: v33-production-e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: warn
