name: ED DU Production QA
on:
  push:
    branches: [cloudflare-production]
  pull_request:
    branches: [cloudflare-production]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Assert production artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_redirects
          grep -Fxq '/* /index.html 200' dist/_redirects
          ! grep -R -E 'V13\.1|V15|Mariana|Juliana|Camila|R\$ 8\.532,00|modo de teste|modo teste' dist
          ! grep -R -E 'supabase\.co|VITE_SUPABASE|@supabase|(^|[^A-Za-z])v[0-9]+-[A-Za-z0-9_.-]+' dist
          echo 'Approved production artifact: PASS'
