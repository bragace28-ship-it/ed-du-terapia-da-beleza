name: ED DU Production QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical Master
        run: npm run master:check

      - name: Build production bundle
        run: npm run build

      - name: Canonical Master build QA
        run: node scripts/qa.mjs

      - name: Runtime surface inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('dist/index.html').read_text(encoding='utf-8')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          print('script_src_count=',len(srcs))
          for x in srcs: print('script_src=',x)
          for label,pat in [
              ('fetch_calls',r'\bfetch\s*\('),
              ('api_paths',r'["\'](/(?:api|auth|functions|supabase)/[^"\']+)'),
              ('neon_refs',r'neon(?:\.tech|\.com|auth)|@neondatabase'),
              ('supabase_refs',r'supabase(?:\.co|\.com)|@supabase'),
              ('vercel_refs',r'\.vercel\.app'),
          ]:
              print(label,'=',len(re.findall(pat,html,re.I)))
          PY

      - name: Verify built HTTP assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/eddu-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/version.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/_redirects >/dev/null

      - name: Release identity
        run: cat dist/version.json

      - name: Verify Cloudflare production credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Inspect canonical Cloudflare production target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@3.90.0 pages project list
          npx --yes wrangler@3.90.0 pages deployment list --project-name=ed-du-terapia-da-beleza

      - name: Set Cloudflare production branch to main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error -X PATCH "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ed-du-terapia-da-beleza" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"production_branch":"main","preview_deployment_setting":"none","production_deployments_enabled":true}')"
          echo "$response" | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x.get("success") is True, x'

      - name: Preserve Cloudflare production runtime secrets
        run: |
          set -euo pipefail
          echo "Cloudflare production secrets are managed in the Pages project."
          echo "This pipeline deliberately does not overwrite them from GitHub Actions."
          echo "They are consumed by Pages Functions through context.env at runtime."

      - name: Deploy canonical Master to Cloudflare production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ed-du-terapia-da-beleza --commit-hash=${{ github.sha }} --commit-message="Canonical Master production"

      - name: Smoke test production runtime
        shell: bash
        run: |
          set -euo pipefail
          base="https://ed-du-terapia-da-beleza.pages.dev"
          for i in {1..12}; do
            health="$(curl --silent --show-error --max-time 20 "$base/api/health" || true)"
            echo "health_attempt=$i $health"
            if python3 -c 'import json,sys; x=json.loads(sys.argv[1]); raise SystemExit(0 if x.get("ok") is True and x.get("reachable") is True else 1)' "$health"; then
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "::error::Production /api/health did not become healthy."
              exit 1
            fi
            sleep 5
          done
          rank="$(curl --silent --show-error --max-time 20 "$base/api/payments?mode=rank&amount=100&method=pix&installments=1")"
          echo "payment_rank=$rank"
          python3 -c 'import json,sys; x=json.loads(sys.argv[1]); assert x.get("ok") is True, x; assert x.get("ranking"), "No configured payment gateway is available in production"; print("Production payment ranking: PASS")' "$rank"

      - name: Delete legacy Cloudflare preview deployments
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/ed-du-terapia-da-beleza/deployments'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          page=1
          deleted=0
          while True:
              req=urllib.request.Request(f'{base}?page={page}',headers=headers)
              with urllib.request.urlopen(req) as resp:
                  data=json.load(resp)
              items=data.get('result') or []
              for item in items:
                  if str(item.get('environment','')).lower()!='preview':
                      continue
                  dep=item.get('id')
                  if not dep:
                      continue
                  req=urllib.request.Request(f'{base}/{dep}?force=true',method='DELETE',headers=headers)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          result=json.load(resp)
                      if result.get('success'):
                          deleted+=1
                          print('deleted preview',dep)
                      else:
                          print('skipped preview',dep,result.get('errors'))
                  except Exception as exc:
                      print('skipped preview',dep,str(exc))
              info=data.get('result_info') or {}
              if not info.get('has_more') or not items:
                  break
              page+=1
          print('preview deployments deleted:',deleted)
          PY

      - name: Delete obsolete Cloudflare homologation project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          status="$(curl --silent --output /tmp/delete-homologacao.json --write-out '%{http_code}' -X DELETE "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ed-du-terapia-da-beleza-homologacao" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          if [ "$status" != "200" ] && [ "$status" != "404" ]; then
            cat /tmp/delete-homologacao.json
            exit 1
          fi
