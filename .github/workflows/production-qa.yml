name: ED DU Production QA
on:
  push:
    branches: [cloudflare-production]
  pull_request:
    branches: [cloudflare-production]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Assert approved production artifact
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_redirects
          grep -Fxq '/* /index.html 200' dist/_redirects
          ! grep -R -E 'supabase\.co|VITE_SUPABASE|@supabase' dist
          grep -Fq 'ED & DU' dist/index.html
          grep -Fq 'V33 Painel Financeiro Completo' dist/index.html
          echo 'Approved V33 master artifact: PASS'