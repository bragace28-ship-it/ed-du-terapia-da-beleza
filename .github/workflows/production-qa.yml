name: ED DU Production QA
on:
  push:
    branches: [cloudflare-production, v33-production-rebuild]
  pull_request:
    branches: [cloudflare-production]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update npm
        run: npm install -g npm@11
      - name: Bootstrap lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then npm install --package-lock-only --ignore-scripts; echo "LOCK_WAS_CREATED=true" >> "$GITHUB_ENV"; fi
      - name: Persist generated lockfile
        if: ${{ env.LOCK_WAS_CREATED == 'true' && github.event_name == 'push' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: add npm lockfile'
          git push
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Assert production artifact
        run: |
          test -f dist/index.html
          ! grep -E 'V13\.1|V15|Mariana|Juliana|Camila|R\$ 8\.532,00|modo de teste' dist/index.html
