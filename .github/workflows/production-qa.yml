name: ED DU Production QA
on:
  push:
    branches: [cloudflare-production]
  pull_request:
    branches: [cloudflare-production]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Assert production artifact
        run: |
          test -f dist/index.html
          ! grep -R -E 'V13\.1|V15|Mariana|Juliana|Camila|R\$ 8\.532,00|modo de teste|modo teste' dist
