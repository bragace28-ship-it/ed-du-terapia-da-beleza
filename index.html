const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const svc=id=>SERVICES.find(x=>x.id==id);
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}
function setRole(r){app.role=r;app.page=r==='pro'?'dashboard':'home';render()}
function go(p){app.page=p;render()}
function cgo(p){app.clientPage=p;render()}
function orderCalc(o){
 let sub=0,cost=0;
 (o.items||[]).forEach(i=>{let s=svc(i.serviceId);sub+=(i.length==='long'?s.long:s.base);cost+=s.cost});
 let discount=Math.max(0,Math.min(Number(o.discount)||0,sub));
 let net=sub-discount,commission=net*.30,profit=net-cost-commission;
 return {sub,discount,net,cost,commission,profit};
}
function header(){
 return `<header class="appbar"><div class="brand"><div class="brandmark">E</div><div class="brandtext"><b>ED & DU</b><span>Terapia da Beleza</span></div></div>
 <div class="role"><button class="${app.role==='pro'?'active':''}" onclick="setRole('pro')">Profissional</button><button class="${app.role==='client'?'active':''}" onclick="setRole('client')">Cliente</button></div></header>`
}
function proNav(){
 let ns=[['dashboard','⌂','Início'],['requests','◉','Solicitações'],['agenda','▣','Agenda'],['clients','♙','Clientes'],['orders','▤','Comandas'],['finance','◔','Financeiro']];
 return ns.map(n=>`<button class="nav ${app.page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join('')
}
function bottomNav(){let ns=[['dashboard','⌂','Início'],['requests','●','Pedidos'],['agenda','▣','Agenda'],['clients','♙','Clientes'],['finance','◔','Financeiro']];return `<nav class=bottom-nav>${ns.map(n=>`<button class="${app.page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}<button onclick="go('orders')"><span>▤</span>Comandas</button></nav>`}
function pro(){
 let body={dashboard:dashboard,requests:requests,agenda:agenda,clients:clients,orders:orders,finance:finance}[app.page]();
 document.getElementById('root').innerHTML=header()+`<div class=layout><aside class=sidebar><div class=side-title>Gestão do salão</div>${proNav()}<div class=side-bottom><div class=online><i class=dot></i>Modo teste ativo</div></div></aside><main>${body}</main></div>${bottomNav()}`
}
function dashboard(){
 let paid=db.orders.filter(o=>o.payment==='paid'),rev=paid.reduce((a,o)=>a+orderCalc(o).net,0)+45000;
 let costs=db.fixedCosts,profit=rev-costs;
 let next=db.requests.find(r=>r.status!=='Cancelado' && r.date>='2026-09-11')||db.requests[0];
 return `<div class=content><div class=page-head><div><h1>Dashboard</h1><p>Visão geral do desempenho do salão.</p></div><span class=badge ok>● Sistema operacional</span></div>
 <div class=grid4><div class="card metric"><small>Faturamento mensal</small><strong>${money(rev)}</strong><span class=trend>↑ 8,4% no mês</span></div>
 <div class="card metric"><small>Custos</small><strong>${money(costs)}</strong><span class=muted>fixos + variáveis</span></div>
 <div class="card metric"><small>Lucro líquido</small><strong>${money(profit)}</strong><span class=trend>${(profit/rev*100).toFixed(1)}% margem</span></div>
 <div class="card metric"><small>Ticket médio</small><strong>${money(rev/Math.max(1,db.att))}</strong><span class=trend>↑ 4,8%</span></div></div><br>
 ${next?`<div class="card next-att"><div class=page-head><div><div class=eyebrow>PRÓXIMO ATENDIMENTO</div><h2 style="margin:5px 0">${esc(next.client)}</h2><p class=muted style="margin:0">${esc(next.date.split('-').reverse().join('/'))} • ${esc(next.time)} • ${esc(next.service)}</p></div><button class="btn primary" onclick="startFromAgenda(${next.id})">▶ Iniciar atendimento</button></div></div><br>`:''}
 <div class=grid2><div class="card bars"><h2>Desempenho mensal</h2><p><span>Faturamento</span><span>${money(rev)}</span></p><div class=bar><i style="width:100%"></i></div><p><span>Custos</span><span>${money(costs)}</span></p><div class=bar><i style="width:${Math.min(100,costs/rev*100)}%"></i></div><p><span>Lucro</span><span>${money(profit)}</span></p><div class=bar><i style="width:${Math.min(100,profit/rev*100)}%"></i></div></div>
 <div class=card><h2>Resumo</h2><div style="font-size:40px;font-weight:800">${db.att}</div><div class=muted>atendimentos no mês</div><br><span class=badge ok>+18 comparado ao mês anterior</span></div></div><br>
 <div class=card><h2>Atalhos</h2><div class=quick><button class=btn onclick="go('requests')"><b>Solicitações</b><span>Ver pedidos pendentes</span></button><button class=btn onclick="go('agenda')"><b>Agenda</b><span>Atendimentos de hoje</span></button><button class=btn onclick="go('clients')"><b>Ficha de cliente</b><span>Cadastro e anamnese</span></button><button class=btn onclick="go('orders')"><b>Comandas</b><span>Abertas e pagamentos</span></button></div></div></div>`
}
function requests(){
 return `<div class=content><div class=page-head><div><h1>Solicitações</h1><p>Aprove, altere o serviço, reagende ou inicie o atendimento.</p></div></div><div class=card><div class=table-scroll><table><thead><tr><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Data / Hora</th><th>Status</th><th>Ações</th></tr></thead><tbody>${db.requests.map(r=>`<tr><td><b>${esc(r.client)}</b></td><td>${esc(r.service)}</td><td>${esc(r.prof)}</td><td>${r.date.split('-').reverse().join('/')}<br>${r.time}</td><td><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${esc(r.status)}</span></td><td><div class=actions><button class="btn ok" onclick="approveReq(${r.id})">Aprovar</button><button class=btn onclick="changeReq(${r.id})">Alterar serviço</button><button class=btn onclick="reschedReq(${r.id})">Reagendar</button><button class="btn primary" onclick="startReq(${r.id})">Iniciar atendimento</button></div></td></tr>`).join('')}</tbody></table></div></div></div>`
}
function approveReq(id){let r=db.requests.find(x=>x.id===id);if(r){r.status='Aprovado';save();toast('Agendamento aprovado e enviado para a agenda.');render()}}
function changeReq(id){let r=db.requests.find(x=>x.id===id);showServiceModal((s,length)=>{r.serviceId=s.id;r.service=s.n;r.length=length||'base';r.status='Serviço alterado';save();toast('Serviço alterado.');render()},r.serviceId)}
function reschedReq(id){let r=db.requests.find(x=>x.id===id);showModal('Reagendar atendimento',`<div class=field><label>Nova data</label><input id=mdate type=date value="${r.date}"></div><div class=field><label>Novo horário</label><select id=mtime>${['09:00','10:30','14:00','16:00','16:30','18:00'].map(t=>`<option ${t===r.time?'selected':''}>${t}</option>`).join('')}</select></div><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveResched(${id})">Enviar nova sugestão</button></div>`)}
function saveResched(id){let r=db.requests.find(x=>x.id===id);r.date=document.getElementById('mdate').value;r.time=document.getElementById('mtime').value;r.status='Nova data sugerida';save();closeModal();toast('Nova data enviada para o cliente.');render()}
function startReq(id){let r=db.requests.find(x=>x.id===id);let o={id:Date.now(),clientId:r.clientId,client:r.client,prof:r.prof,items:[],discount:0,discountReason:'',open:true,payment:'draft',request:id};db.orders.unshift(o);r.status='Em atendimento';save();app.page='orders';render();openOrder(o.id)}
function agenda(){
 let ev=db.requests.filter(r=>r.status!=='Cancelado').slice(0,12);
 let days=[18,19,20,21,22,23,24];
 return `<div class=content><div class=page-head><div><h1>Agenda</h1><p>Organize atendimentos, comandos e horários.</p></div><div class=actions><button class=btn onclick="syncGoogle()">↻ Sincronizar Google</button><button class="btn primary" onclick="newOrder()">+ Nova comanda</button></div></div>
 <div class=grid3><div class=card metric><small>Hoje</small><strong>${ev.filter(x=>x.date==='2026-09-18').length}</strong><span class=muted>atendimentos</span></div><div class=card metric><small>Próximos</small><strong>${ev.length}</strong><span class=muted>agendamentos</span></div><div class=card metric><small>Lembrete</small><strong>30 min</strong><span class=muted>antes do atendimento</span></div></div><br>
 <div class=card><div class=month-strip><button class="month-chip active">Setembro 2026</button><button class=month-chip>Outubro 2026</button><button class=month-chip>Novembro 2026</button></div><br>
 ${days.map((d,di)=>{let date='2026-09-'+String(d).padStart(2,'0');let list=ev.filter(x=>x.date===date);return `<div class=calendar-day><h3>${String(d).padStart(2,'0')}/09/2026</h3>${list.length?list.map(e=>{let o=db.orders.find(x=>x.request===e.id&&x.open);return `<div class=event><div><b>${esc(e.time)} · ${esc(e.client)}</b><small>${esc(e.service)} · ${esc(e.prof)}</small></div><div class=actions><button class=btn onclick="editAgenda(${e.id})">Editar</button><button class=btn onclick="googleEvent('${e.date}','${e.time}','${esc(e.client)}','${esc(e.service)}')">Google</button><button class="btn primary" onclick="startFromAgenda(${e.id})">${o?'Abrir comando':'Abrir comando'}</button>${o?`<button class="btn warn" onclick="closeOrder(${o.id})">Fechar comando</button>`:''}</div></div>`}).join(''):'<span class=muted>Nenhum atendimento agendado.</span>'}</div>`}).join('')}
 <div class=summary><b>🔔 Lembrete automático: 30 minutos antes</b><div class=muted>Na versão de produção, o lembrete poderá ser conectado a notificações, e-mail e WhatsApp mediante consentimento.</div></div></div></div>`
}
function editAgenda(id){let r=db.requests.find(x=>x.id===id);if(!r)return;showModal('Editar agendamento',`<div class=two><div class=field><label>Data</label><input id=edate type=date value="${r.date}"></div><div class=field><label>Horário</label><select id=etime>${['09:00','10:30','14:00','16:00','16:30','18:00'].map(t=>`<option ${t===r.time?'selected':''}>${t}</option>`).join('')}</select></div></div><div class=field><label>Profissional</label><select id=eprof>${PROS.map(p=>`<option ${p===r.prof?'selected':''}>${p}</option>`).join('')}</select></div><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="cancelAgenda(${id})">Cancelar agendamento</button><button class="btn primary" onclick="saveAgendaEdit(${id})">Salvar</button></div>`)}
function saveAgendaEdit(id){let r=db.requests.find(x=>x.id===id);r.date=document.getElementById('edate').value;r.time=document.getElementById('etime').value;r.prof=document.getElementById('eprof').value;r.status='Alterado';save();closeModal();toast('Agendamento atualizado.');render()}
function cancelAgenda(id){let r=db.requests.find(x=>x.id===id);r.status='Cancelado';save();closeModal();toast('Agendamento cancelado.');render()}

function startFromAgenda(id){let r=db.requests.find(x=>x.id===id);if(!r)return;let existing=db.orders.find(o=>o.request===id&&o.open);if(existing){app.page='orders';render();setTimeout(()=>openOrder(existing.id),0);return}startReq(id)}
function syncGoogle(){toast('Sincronização Google preparada. A versão online usará OAuth para sincronização real.')}
function googleEvent(date,time,client,service){
 let d=String(date||'').replace(/-/g,'');let t=String(time||'').replace(':','');if(d.length!==8||t.length<4){toast('Data ou horário inválido.');return}
 let start=d+'T'+t.slice(0,4)+'00';let hh=Number(t.slice(0,2));let end=(hh+1).toString().padStart(2,'0')+t.slice(2,4);let endDate=d+'T'+end+'00';
 let url='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent('ED & DU • '+service)+'&dates='+start+'/'+endDate+'&details='+encodeURIComponent('Cliente: '+client);window.open(url,'_blank')
}
function clients(){
 return `<div class=content><div class=page-head><div><h1>Clientes</h1><p>Cadastro, relacionamento, ficha, anamnese e documentos.</p></div><button class="btn primary" onclick="newClient()">+ Novo cliente</button></div><div class=filters><input placeholder="Buscar cliente..." oninput="filterClientCards(this.value)"><select onchange="filterClientCards('',this.value)"><option value="all">Todos</option><option value="signed">Termo assinado</option><option value="pending">Termo pendente</option></select></div><div id=clientCards class=client-cards>${clientCardList(db.clients)}</div></div>`
}
function clientCardList(list){return list.map(c=>{let initials=c.name.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();return `<article class=client-card data-client-search="${esc((c.name+' '+c.phone+' '+c.email).toLowerCase())}" data-term="${c.term?'signed':'pending'}"><div class=client-card-head><div class=client-main><div class=client-avatar>${initials}</div><div><h3 style="margin:0">${esc(c.name)}</h3><p class=muted style="margin:3px 0">${esc(c.phone)}</p><small class=muted>${esc(c.email||'Sem e-mail')}</small></div></div><span class="badge ${c.term?'ok':'warn'}">${c.term?'Termo ok':'Termo pendente'}</span></div><div class=summary style="margin-top:14px"><div class=summary-row><span>Fidelidade</span><b>${c.points||0} pts</b></div><div class=summary-row><span>Procedimentos</span><b>${(c.history||[]).length}</b></div></div><div class=client-actions><button class=btn onclick="editClient(${c.id})">Editar</button><button class=btn onclick="wa('${esc(c.phone)}','Olá ${esc(c.name)}, aqui é da ED & DU | Terapia da Beleza.')">WhatsApp</button><button class="btn primary" onclick="openClientFile(${c.id})">Abrir ficha</button></div></article>`}).join('')||'<div class="empty">Nenhum cliente encontrado.</div>'}
function filterClientCards(q='',term='all'){q=(q||'').toLowerCase();document.querySelectorAll('#clientCards .client-card').forEach(el=>{let ok=(!q||el.dataset.clientSearch.includes(q))&&(term==='all'||el.dataset.term===term);el.style.display=ok?'block':'none'})}

function newClient(){showModal('Novo cliente',clientForm({},'create'))}
function clientForm(c,mode){return `<div class=two><div class=field><label>Nome completo</label><input id=cn value="${esc(c.name||'')}"></div><div class=field><label>Telefone / WhatsApp</label><input id=cp value="${esc(c.phone||'')}"></div></div><div class=field><label>E-mail</label><input id=ce type=email value="${esc(c.email||'')}"></div><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="${mode==='create'?'createClient()':'updateClient('+c.id+')'}">${mode==='create'?'Cadastrar':'Salvar alterações'}</button></div>`}
function editClient(id){let c=db.clients.find(x=>x.id===id);showModal('Editar dados cadastrais',clientForm(c,'edit'))}
function createClient(){let n=cn.value.trim(),p=cp.value.trim(),e=ce.value.trim();if(!n||!p){toast('Nome e telefone são obrigatórios.');return}db.clients.push({id:Date.now(),name:n,phone:p,email:e,points:0,term:false,anam:'',history:[],anams:[]});save();closeModal();toast('Cliente cadastrado.');render()}
function updateClient(id){let c=db.clients.find(x=>x.id===id);c.name=cn.value.trim()||c.name;c.phone=cp.value.trim()||c.phone;c.email=ce.value.trim();save();closeModal();toast('Cadastro atualizado.');render()}
function openClientFile(id){
 let c=db.clients.find(x=>x.id===id);app.selectedClient=id;
 showModal('Ficha do Cliente',`<div class=actions><button class=btn onclick="editClient(${id});">Editar cadastro</button><button class=btn onclick="wa('${esc(c.phone)}','Olá ${esc(c.name)}, tudo bem? Aqui é da ED & DU | Terapia da Beleza.')">WhatsApp</button><button class="btn primary" onclick="sendTerm(${id})">Enviar Termo de Responsabilidade</button></div><br><div class=grid2><div class=card><h3>Dados pessoais</h3><p><b>${esc(c.name)}</b><br>${esc(c.phone)}<br>${esc(c.email)}</p><span class="badge ok">${c.points} pontos</span></div><div class=card><h3>Termo de Responsabilidade</h3><span class="badge ${c.term?'ok':'warn'}">${c.term?'Assinado digitalmente':'Pendente de assinatura'}</span><p class=muted>Envio por link seguro na versão online.</p></div></div><br><div class=card><h3>Anamnese detalhada</h3><div class=two><div class=field><label>Data</label><input id=ad type=date value="${new Date().toISOString().slice(0,10)}"></div><div class=field><label>Hora</label><input id=at type=time value="${new Date().toTimeString().slice(0,5)}"></div></div><div class=field><label>Descrição do procedimento / observações</label><textarea id=ax rows=5 placeholder="Alergias, sensibilidade, produtos, técnica, resultado e orientações."></textarea></div><div class=field><label>Fotos do procedimento</label><input id=af type=file accept="image/*" multiple></div><button class="btn primary" onclick="saveAnam(${id})">Salvar anamnese</button>${(c.anams||[]).map(a=>`<div class=summary style="margin-top:10px"><b>${a.date} às ${a.time}</b><p>${esc(a.desc)}</p><span class=muted>${a.photos} foto(s) anexada(s)</span></div>`).join('')}</div><br><div class=card><h3>Histórico de procedimentos</h3><ul>${c.history.length?c.history.map(h=>`<li>${esc(h)}</li>`).join(''):'<li class=muted>Sem procedimentos registrados.</li>'}</ul></div>`)}
function saveAnam(id){let c=db.clients.find(x=>x.id===id),d=ad.value,t=at.value,x=ax.value.trim(),photos=af.files.length;if(!d||!t||!x){toast('Preencha data, hora e descrição.');return}c.anams=c.anams||[];c.anams.unshift({date:d,time:t,desc:x,photos});c.anam=x;save();openClientFile(id);toast('Anamnese salva.')}
function sendTerm(id){let c=db.clients.find(x=>x.id===id);toast('Termo preparado para envio a '+c.name+'. Na produção será gerado link de assinatura digital.')}
function wa(phone,msg){let n=String(phone).replace(/\D/g,'');if(n.length<10){toast('Telefone inválido.');return}if(!n.startsWith('55'))n='55'+n;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank')}
function orders(){
 let open=db.orders.filter(o=>o.open),pay=db.orders.filter(o=>!o.open&&o.payment==='pending'),paid=db.orders.filter(o=>!o.open&&o.payment==='paid');
 return `<div class=content><div class=page-head><div><h1>Comandas</h1><p>Controle completo de serviço, desconto, custo, comissão e lucro.</p></div><button class="btn primary" onclick="newOrder()">+ Abrir comanda</button></div>
 <div class=grid3><div class=card><div class=eyebrow>Em aberto</div><strong style="font-size:28px">${open.length}</strong><p class=muted>Atendimentos em andamento</p></div><div class=card><div class=eyebrow>Aguardando pagamento</div><strong style="font-size:28px">${pay.length}</strong><p class=muted>Comandas enviadas ao cliente</p></div><div class=card><div class=eyebrow>Pagas</div><strong style="font-size:28px">${paid.length}</strong><p class=muted>Histórico concluído</p></div></div><br>
 ${orderSection('COMANDAS ABERTAS',open,'open')}${orderSection('AGUARDANDO PAGAMENTO',pay,'pay')}${orderSection('PAGAS',paid,'paid')}
 </div>`
}
function orderSection(title,list,type){return `<div class=card style="margin-bottom:16px"><div class=head style="margin-bottom:10px"><div><h2>${title}</h2><span class=muted>${type==='open'?'Editar e fechar quando o atendimento terminar.':type==='pay'?'Pagamento aguardando confirmação.':'Histórico de comandas concluídas.'}</span></div></div>${list.length?list.map(o=>orderCard(o)).join(''):'<p class=muted>Nenhuma comanda nesta etapa.</p>'}</div>`}
function orderCard(o){let x=orderCalc(o);return `<div class=card style="margin:10px 0;background:#fbfaf8"><div class=page-head style="margin-bottom:8px"><div><h3>${esc(o.client)} <span class="badge ${o.open?'warn':o.payment==='paid'?'ok':'warn'}">${o.open?'EM ABERTO':o.payment==='paid'?'PAGO':'AGUARDANDO PAGAMENTO'}</span></h3><span class=muted>Profissional: ${esc(o.prof)}</span></div><strong class=money>${money(x.net)}</strong></div><div class=grid4><div><small class=muted>Subtotal</small><br><b>${money(x.sub)}</b></div><div><small class=muted>Desconto</small><br><b>${money(x.discount)}</b></div><div><small class=muted>Custo</small><br><b>${money(x.cost)}</b></div><div><small class=muted>Lucro</small><br><b>${money(x.profit)}</b></div></div><br><div class=actions><button class=btn onclick="viewOrder(${o.id})">Visualizar comanda</button><button class=btn onclick="openOrder(${o.id})">Editar comanda</button>${o.open?`<button class="btn primary" onclick="closeOrder(${o.id})">Fechar comanda e escolher pagamento</button>`:o.payment==='pending'?`<button class="btn warn" onclick="openPaymentModal(${o.id})">Receber pagamento</button>`:''}</div></div>`}
function viewOrder(id){
 let o=db.orders.find(x=>x.id===id);if(!o)return;let x=orderCalc(o);
 showModal('Visualização da comanda',`<div class=eyebrow>RESUMO DO ATENDIMENTO</div>
 <div class=summary-box><p><b>Cliente:</b> ${esc(o.client)}</p><p><b>Profissional:</b> ${esc(o.prof)}</p>
 <div class=command-services>${(o.items||[]).map(it=>{let s=svc(it.serviceId);if(!s)return '';let v=it.length==='long'?s.long:s.base;return `<div class=command-service><span>${esc(s.n)} <small class=muted>(${it.length==='long'?'Longo':'Base'})</small></span><b>${money(v)}</b></div>`}).join('')||'<p class=muted>Nenhum serviço lançado.</p>'}</div><hr>
 <div class=summary-row><span>Subtotal</span><b>${money(x.sub)}</b></div><div class=summary-row><span>Desconto</span><b>- ${money(x.discount)}</b></div>
 <div class=summary-row total><span>Total cliente</span><b>${money(x.net)}</b></div><div class=summary-row><span>Custo total</span><b>${money(x.cost)}</b></div><div class=summary-row><span>Comissão (30%)</span><b>${money(x.commission)}</b></div><div class=summary-row><span>Lucro estimado</span><b>${money(x.profit)}</b></div></div><br>
 <div class=actions><button class="btn outline" onclick="closeModal()">Fechar janela</button>${o.open?`<button class="btn primary" onclick="closeOrder(${o.id})">Fechar comanda</button>`:o.payment==='pending'?`<button class="btn primary" onclick="openPaymentModal(${o.id})">Receber pagamento</button>`:`<span class="badge ok">Comanda liquidada</span>`}</div>`)
}
function newOrder(){let c=db.clients[0];let o={id:Date.now(),clientId:c.id,client:c.name,prof:PROS[0],items:[],discount:0,discountReason:'',open:true,payment:'draft'};db.orders.unshift(o);save();openOrder(o.id)}
function openOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;app.editingOrder=id;let x=orderCalc(o);showModal('Editar comanda • '+o.client,orderEditor(o,x))}

function orderEditor(o,x){
 return `<div class=two><div class=field><label>Cliente</label><select id=oc>${db.clients.map(c=>`<option value="${c.id}" ${c.id===o.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class=field><label>Profissional</label><select id=op>${PROS.map(p=>`<option ${p===o.prof?'selected':''}>${esc(p)}</option>`).join('')}</select></div></div>
 <div class=section-title><div><h3>Serviços e produtos</h3><span class=muted>Edite os itens lançados no atendimento.</span></div><button class="btn" onclick="addOrderLine()">+ Adicionar serviço</button></div>
 <div id=orderLines class=order-lines>${(o.items||[]).map((it,i)=>lineEditor(it,i)).join('')||'<div class=empty>Nenhum serviço lançado. Adicione pelo menos um serviço.</div>'}</div><br>
 <div class=two><div class=field><label>Desconto (R$)</label><input id=od type=number min=0 step=.01 value="${Number(o.discount||0)}"></div><div class=field><label>Motivo do desconto</label><input id=odr value="${esc(o.discountReason||'')}" placeholder="Ex.: campanha, fidelização..."></div></div>
 <div class=summary><div class=summary-row><span>Subtotal</span><b>${money(x.sub)}</b></div><div class=summary-row><span>Desconto</span><b>${money(x.discount)}</b></div><div class=summary-row total><span>Total cliente</span><b>${money(x.net)}</b></div><div class=summary-row><span>Custo</span><b>${money(x.cost)}</b></div><div class=summary-row><span>Comissão 30%</span><b>${money(x.commission)}</b></div><div class=summary-row><span>Lucro estimado</span><b>${money(x.profit)}</b></div></div><br>
 <div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="applyOrderChanges(${o.id})">Salvar alterações</button></div>`
}
function lineEditor(it,i){let s=svc(it.serviceId)||SERVICES[0];return `<div class=order-line data-i="${i}"><div><label>Serviço</label><select class=li-service onchange="recalcOrderModal()">${SERVICES.map(s=>`<option value="${s.id}" ${s.id===it.serviceId?'selected':''}>${s.n}</option>`).join('')}</select></div><div><label>Comprimento</label><select class=li-length onchange="recalcOrderModal()"><option value="base" ${it.length!=='long'?'selected':''}>Base</option><option value="long" ${it.length==='long'?'selected':''}>Longo</option></select></div><div><label>Valor</label><input class=li-value value="${money(it.length==='long'?s.long:s.base)}" disabled></div><div><label>Custo</label><input class=li-cost value="${money(s.cost)}" disabled></div><button class="btn danger" onclick="this.closest('.order-line').remove();recalcOrderModal()">Remover</button></div>`}
function addOrderLine(){let box=document.getElementById('orderLines');let div=document.createElement('div');div.innerHTML=lineEditor({serviceId:1,length:'base'},Date.now());box.appendChild(div.firstElementChild);recalcOrderModal()}
function recalcOrderModal(){let rows=[...document.querySelectorAll('#orderLines .order-line')];let sub=0,cost=0;rows.forEach(r=>{let s=svc(Number(r.querySelector('.li-service').value));let l=r.querySelector('.li-length').value;sub+=l==='long'?s.long:s.base;cost+=s.cost;let v=r.querySelector('.li-value');if(v)v.value=money(l==='long'?s.long:s.base);let c=r.querySelector('.li-cost');if(c)c.value=money(s.cost)});let d=Math.max(0,Math.min(Number(document.getElementById('od')?.value)||0,sub));let net=sub-d,com=net*.3,profit=net-cost-com;let box=document.querySelector('#orderLines')?.closest('.modal')?.querySelector('.summary');if(box){let vals=box.querySelectorAll('.summary-row b');if(vals.length>=6){vals[0].textContent=money(sub);vals[1].textContent='- '+money(d);vals[2].textContent=money(net);vals[3].textContent=money(cost);vals[4].textContent=money(com);vals[5].textContent=money(profit)}}}
function applyOrderChanges(id){let o=db.orders.find(x=>x.id===id);if(!o)return;o.clientId=Number(document.getElementById('oc').value);o.client=db.clients.find(c=>c.id===o.clientId)?.name||o.client;o.prof=document.getElementById('op').value;o.discount=Number(document.getElementById('od').value)||0;o.discountReason=document.getElementById('odr').value.trim();o.items=[...document.querySelectorAll('#orderLines .order-line')].map(row=>({serviceId:Number(row.querySelector('.li-service').value),length:row.querySelector('.li-length').value}));let x=orderCalc(o);if(o.discount>x.sub)o.discount=x.sub;save();closeModal();toast('Comanda atualizada. Lucro recalculado.');render()}
function closeOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let x=orderCalc(o);if(!o.items.length){toast('Adicione pelo menos um serviço antes de fechar.');openOrder(id);return}o.open=false;o.payment='pending';o.allowedPayments=[...(db.settings.paymentMethods||[])];o.closedAt=new Date().toLocaleString('pt-BR');save();closeModal();toast('Comanda fechada. Selecione a forma de pagamento.');openPaymentModal(id)}
function sendPayment(id){openPaymentModal(id)}
function openPaymentModal(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let x=orderCalc(o);showModal('Pagamento da comanda',`<div class=summary-box><div class=summary-row total><span>Total a liquidar</span><b>${money(x.net)}</b></div></div><br><div class=field><label>Forma de pagamento</label><div class=pay-method-grid>${(o.allowedPayments||db.settings.paymentMethods||['Pix','Cartão de Crédito','Cartão de Débito','Dinheiro','Boleto','Parcelamento']).map(m=>`<button type=button class="pay-method ${o.paymentMethod===m?'selected':''}" onclick="selectPaymentMethod(${id},'${m}')">${m}</button>`).join('')}</div></div><div id=payment-extra>${o.paymentMethod==='Cartão de Crédito'?`<div class=credit-link><b>Cartão de crédito</b><p class=muted>O compromisso será conciliado com a fatura do cartão sem duplicar o custo.</p></div>`:o.paymentMethod==='Parcelamento'?`<div class=two><div class=field><label>Número de parcelas</label><select id=payInst>${[2,3,4,5,6,10,12].map(n=>`<option>${n}</option>`).join('')}</select></div><div class=field><label>Juros (%)</label><input id=payInterest type=number value="0" min="0" step="0.01"></div></div>`:''}</div><br><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="confirmOrderPayment(${id})">Confirmar liquidação</button></div>`)}
function selectPaymentMethod(id,m){let o=db.orders.find(x=>x.id===id);if(!o)return;o.paymentMethod=m;let extra=document.getElementById('payment-extra');if(extra)extra.innerHTML=m==='Cartão de Crédito'?'<div class=credit-link><b>Cartão de crédito</b><p class=muted>Pagamento associado à fatura do cartão. O gasto individual não será contado novamente na fatura global.</p></div>':m==='Parcelamento'?'<div class=two><div class=field><label>Número de parcelas</label><select id=payInst><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>10</option><option>12</option></select></div><div class=field><label>Juros (%)</label><input id=payInterest type=number value="0" min="0" step="0.01"></div></div>':'';document.querySelectorAll('.pay-method').forEach(b=>b.classList.toggle('selected',b.textContent.trim()===m))}
function confirmOrderPayment(id){let o=db.orders.find(x=>x.id===id);if(!o||!o.paymentMethod){toast('Selecione a forma de pagamento.');return}let x=orderCalc(o);if(o.paymentMethod==='Parcelamento'){let n=Number(document.getElementById('payInst')?.value)||2;let interest=Number(document.getElementById('payInterest')?.value)||0;let total=x.net*(1+interest/100);o.installments=n;o.installmentTotal=total;o.payment='paid';o.paidAt=new Date().toLocaleString('pt-BR');o.paymentConfirmed=true;db.receivables=(db.receivables||[]).filter(r=>r.orderId!==id);for(let i=1;i<=n;i++){let due=new Date();due.setMonth(due.getMonth()+i);db.receivables.push({id:Date.now()+i,orderId:id,client:o.client,description:'Parcela '+i+'/'+n+' • '+o.client,value:total/n,dueDate:due.toISOString().slice(0,10),method:'Parcelamento',category:'Comanda',status:'pending'})}}else{o.payment='paid';o.paidAt=new Date().toLocaleString('pt-BR');o.paymentConfirmed=true}save();closeModal();toast('Pagamento confirmado e comanda liquidada.');render()}
function markPaid(id){openPaymentModal(id)}
function dateISO(d){return d||new Date().toISOString().slice(0,10)}
function monthKey(d){return String(d||'').slice(0,7)}
function monthLabel(key){let [y,m]=key.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function nextMonth(){let d=new Date();d.setMonth(d.getMonth()+1);return d.toISOString().slice(0,7)}
function accountStatus(x){if(x.status==='paid'||x.status==='received')return 'Concluído';let t=monthKey(x.dueDate||x.date),now=currentMonth();if(t<now)return 'Atrasado';if(t===now)return 'Este mês';return 'Próximo mês'}
function paymentSettingsCard(){let ms=['Pix','Cartão de Crédito','Cartão de Débito','Dinheiro','Boleto','Parcelamento'];return `<div class="card finance-section"><div class=section-title><div><h2>Formas de pagamento</h2><span class=muted>Estas opções ficam disponíveis ao fechar a comanda e são gravadas nela para o cliente.</span></div></div><div class=pay-method-grid>${ms.map(m=>`<label class="pay-method ${db.settings.paymentMethods.includes(m)?'selected':''}" style="display:flex;align-items:center;justify-content:center;gap:8px"><input type=checkbox ${db.settings.paymentMethods.includes(m)?'checked':''} onchange="togglePaymentMethod('${m.replace(/'/g,"\\'")}',this.checked)" style="width:auto">${m}</label>`).join('')}</div></div>`}
function togglePaymentMethod(m,on){let set=new Set(db.settings.paymentMethods||[]);if(on)set.add(m);else set.delete(m);if(!set.size){toast('Mantenha pelo menos uma forma de pagamento.');render();return}db.settings.paymentMethods=[...set];save();toast('Formas de pagamento atualizadas.');render()}
function finance(){let tab=app.financeTab||'overview';return `<div class=content><div class=page-head><div><h1>Gestão de Contas</h1><p>Controle financeiro completo do salão: pagar, receber, vencimentos e resultados.</p></div><div class=actions><button class=btn onclick="openAccount('payable')">+ Conta a pagar</button><button class="btn primary" onclick="openAccount('receivable')">+ Conta a receber</button><button class=btn onclick="exportCSV()">Exportar CSV</button></div></div><div class=account-tabs><button class="btn ${tab==='overview'?'active':''}" onclick="setFinanceTab('overview')">Visão geral</button><button class="btn ${tab==='payables'?'active':''}" onclick="setFinanceTab('payables')">Contas a pagar</button><button class="btn ${tab==='receivables'?'active':''}" onclick="setFinanceTab('receivables')">Contas a receber</button></div>${tab==='overview'?financeOverview():tab==='payables'?financeAccounts('payable'):financeAccounts('receivable')}</div>`}
function setFinanceTab(t){app.financeTab=t;render()}
function financeOverview(){let mk=currentMonth(),nm=nextMonth();let p=db.payables.filter(x=>x.status!=='paid'),r=db.receivables.filter(x=>x.status!=='received');let pm=p.filter(x=>monthKey(x.dueDate)===mk).reduce((a,x)=>a+Number(x.value||0),0),pn=p.filter(x=>monthKey(x.dueDate)===nm).reduce((a,x)=>a+Number(x.value||0),0),rm=r.filter(x=>monthKey(x.dueDate)===mk).reduce((a,x)=>a+Number(x.value||0),0),rn=r.filter(x=>monthKey(x.dueDate)===nm).reduce((a,x)=>a+Number(x.value||0),0);let paid=db.orders.filter(o=>o.payment==='paid'),rev=paid.reduce((a,o)=>a+orderCalc(o).net,0)+48750,cost=db.fixedCosts+pm,profit=rev-cost;return `<div class=mini-kpis><div class=mini-kpi><small>A pagar — este mês</small><b>${money(pm)}</b></div><div class=mini-kpi><small>A receber — este mês</small><b>${money(rm)}</b></div><div class=mini-kpi><small>A pagar — próximo mês</small><b>${money(pn)}</b></div><div class=mini-kpi><small>A receber — próximo mês</small><b>${money(rn)}</b></div></div><br><div class=grid2><div class=card><div class=section-title><div><h2>Vencimentos deste mês</h2><span class=muted>Entradas e saídas previstas</span></div><button class=btn onclick="setFinanceTab('payables')">Ver contas</button></div>${dueRows([...p.filter(x=>monthKey(x.dueDate)===mk).map(x=>({...x,_type:'pay'})),...r.filter(x=>monthKey(x.dueDate)===mk).map(x=>({...x,_type:'rec'}))].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')),5)}</div><div class=card><h2>Resultado do mês</h2><div class=summary><div class=summary-row><span>Faturamento</span><b>${money(rev)}</b></div><div class=summary-row><span>Custos</span><b>${money(cost)}</b></div><div class=summary-row total><span>Lucro estimado</span><b>${money(profit)}</b></div><div class=summary-row><span>Margem</span><b>${(profit/Math.max(1,rev)*100).toFixed(1)}%</b></div></div><br><p class=muted>Comissões são calculadas em 30% do valor líquido da comanda.</p></div></div><br><div class=card finance-section><div class=section-title><div><h2>Faturas de cartão</h2><span class=muted>Contas de fornecedores pagas no crédito ficam vinculadas aqui para evitar duplicidade.</span></div></div>${(db.cardInvoices||[]).length?(db.cardInvoices.map(i=>`<div class=account-row><div><b>${esc(i.description)}</b><small class=muted>${esc(i.id)} • ${esc(i.status)}</small></div><strong>${money(i.total)}</strong></div>`).join('')):'<div class=empty>Nenhuma fatura de cartão vinculada.</div>'}</div><br><div class=card><div class=section-title><div><h2>Próximo mês</h2><span class=muted>Planejamento de caixa</span></div></div>${dueRows([...p.filter(x=>monthKey(x.dueDate)===nm).map(x=>({...x,_type:'pay'})),...r.filter(x=>monthKey(x.dueDate)===nm).map(x=>({...x,_type:'rec'}))].sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')),10)}</div>`}
function dueRows(list,limit){if(!list.length)return '<div class=empty>Nenhum vencimento cadastrado para este período.</div>';return `<div class=account-list>${list.slice(0,limit).map(x=>`<div class=account-row><div><b>${esc(x.description||x.client||'Conta')}</b><small class=muted>${x._type==='pay'?'Saída':'Entrada'} • ${esc(x.category||'')}</small></div><div>${esc(x.dueDate||'-')}</div><div><span class="badge ${x.status==='paid'||x.status==='received'?'ok':accountStatus(x)==='Atrasado'?'danger':'warn'}">${x.status==='paid'||x.status==='received'?'Concluído':accountStatus(x)}</span></div><div class=amount>${money(x.value)}</div><div class=account-actions></div></div>`).join('')}</div>${paymentSettingsCard()}`}
function financeAccounts(type){let arr=type==='payable'?db.payables:db.receivables;let title=type==='payable'?'Contas a pagar':'Contas a receber';let thisM=arr.filter(x=>monthKey(x.dueDate)===currentMonth()).reduce((a,x)=>a+Number(x.value||0),0),nextM=arr.filter(x=>monthKey(x.dueDate)===nextMonth()).reduce((a,x)=>a+Number(x.value||0),0);return `<div class=mini-kpis><div class=mini-kpi><small>Total cadastrado</small><b>${money(arr.reduce((a,x)=>a+Number(x.value||0),0))}</b></div><div class=mini-kpi><small>Este mês</small><b>${money(thisM)}</b></div><div class=mini-kpi><small>Próximo mês</small><b>${money(nextM)}</b></div><div class=mini-kpi><small>Em aberto</small><b>${arr.filter(x=>!['paid','received'].includes(x.status)).length}</b></div></div><br><div class=card><div class=section-title><div><h2>${title}</h2><span class=muted>Cadastre, filtre, edite, conclua ou exclua lançamentos.</span></div><button class="btn primary" onclick="openAccount('${type}')">+ Nova conta</button></div><div class=filters><input id="afilter" placeholder="Buscar descrição, cliente ou fornecedor" oninput="filterAccounts('${type}')"><select id="amonth" onchange="filterAccounts('${type}')"><option value="all">Todos os meses</option><option value="${currentMonth()}">Este mês</option><option value="${nextMonth()}">Próximo mês</option><option value="overdue">Atrasadas</option></select><select id="astatus" onchange="filterAccounts('${type}')"><option value="all">Todos os status</option><option value="pending">Em aberto</option><option value="paid">Concluído</option><option value="overdue">Atrasado</option></select><select id="acat" onchange="filterAccounts('${type}')"><option value="all">Todas as categorias</option>${[...new Set(arr.map(x=>x.category||'Operacional'))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="accountList">${accountRows(type,arr)}</div></div>`}
function accountRows(type,arr){if(!arr.length)return '<div class=empty>Nenhuma conta cadastrada. Use “+ Nova conta” para lançar a primeira.</div>';return `<div class=account-list>${arr.slice().sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||'')).map(x=>{let done=type==='payable'?x.status==='paid':x.status==='received';let st=done?'Concluído':accountStatus(x);return `<div class=account-row data-search="${esc((x.description||'')+' '+(x.client||'')+' '+(x.supplier||'')+' '+(x.category||''))}" data-month="${monthKey(x.dueDate)}" data-status="${done?'paid':st==='Atrasado'?'overdue':'pending'}" data-cat="${esc(x.category||'')}"><div><b>${esc(x.description||x.client||'Conta')}</b><small class=muted>${esc(x.supplier||x.client||'')} • ${esc(x.category||'')}${x.note?' • '+esc(x.note):''}</small></div><div><small class=muted>Vencimento</small><br>${esc(x.dueDate||'-')}</div><div><span class="badge ${done?'ok':st==='Atrasado'?'danger':'warn'}">${st}</span></div><div class=amount>${money(x.value)}</div><div class=account-actions>${x.attachmentData?`<button class="btn" onclick="viewAttachment('${type}',${x.id})">Anexo</button>`:''}<button class=btn onclick="editAccount('${type}',${x.id})">Editar</button>${done?'':`<button class="btn ok" onclick="completeAccount('${type}',${x.id})">${type==='payable'?'Pagar':'Receber'}</button>`}<button class="btn danger" onclick="deleteAccount('${type}',${x.id})">Excluir</button></div></div>`}).join('')}</div>`}
function filterAccounts(type){let q=(document.getElementById('afilter').value||'').toLowerCase(),m=document.getElementById('amonth').value,s=document.getElementById('astatus').value,c=document.getElementById('acat').value;document.querySelectorAll('#accountList .account-row').forEach(row=>{let ok=(!q||row.dataset.search.toLowerCase().includes(q))&&(m==='all'||(m==='overdue' ? row.dataset.status==='overdue' : row.dataset.month===m))&&(s==='all'||row.dataset.status===s)&&(c==='all'||row.dataset.cat===c);row.style.display=ok?'grid':'none'})}
function viewAttachment(type,id){let arr=type==='payable'?db.payables:db.receivables,x=arr.find(a=>a.id===id);if(!x||!x.attachmentData){toast('Nenhum anexo encontrado.');return}let isPdf=(x.attachmentType||'').includes('pdf');let body=isPdf?`<iframe src="${x.attachmentData}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:12px"></iframe>`:`<img src="${x.attachmentData}" alt="Comprovante" style="max-width:100%;max-height:60vh;display:block;margin:auto;border-radius:12px">`;showModal('Anexo • '+(x.attachmentName||'documento'),body+`<br><div class=actions><button class="btn outline" onclick="closeModal()">Fechar</button></div>`)}
function openAccount(type,id=null){let x=id?(type==='payable'?db.payables:db.receivables).find(a=>a.id===id):null;let isP=type==='payable';showModal(x?'Editar conta':'Nova conta',`<div class=two><div class=field><label>${isP?'Fornecedor':'Cliente'}</label><input id=accparty value="${esc(x?.supplier||x?.client||'')}" placeholder="Nome"></div><div class=field><label>Descrição</label><input id=accdesc value="${esc(x?.description||'')}" placeholder="Ex.: Produtos / serviço"></div></div><div class=grid3><div class=field><label>Valor (R$)</label><input id=accvalue type=number min=0 step=.01 value="${x?.value||''}"></div><div class=field><label>Vencimento</label><input id=accdate type=date value="${x?.dueDate||new Date().toISOString().slice(0,10)}"></div><div class=field><label>Forma de pagamento</label><select id=accmethod>${['Pix','Cartão de Crédito','Cartão de Débito','Boleto','Dinheiro','Transferência'].map(m=>`<option ${m===(x?.method||'Pix')?'selected':''}>${m}</option>`).join('')}</select></div></div><div class=two><div class=field><label>Categoria</label><select id=acccat>${['Operacional','Produtos','Aluguel','Folha','Impostos','Marketing','Serviços','Cartão de Crédito','Outros'].map(c=>`<option ${c===(x?.category||'Operacional')?'selected':''}>${c}</option>`).join('')}</select></div><div class=field><label>Observações</label><input id=accnote value="${esc(x?.note||'')}" placeholder="Opcional"></div></div><div class=attachment-box><b>Documentos da conta</b><div class=muted>Fotografe o comprovante ou anexe PDF/imagem.</div><input id=accfile type=file accept="image/*,.pdf" capture="environment"><small class=muted>${x?.attachmentName?`Anexo atual: ${esc(x.attachmentName)}`:'Nenhum anexo selecionado.'}</small></div><br><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAccount('${type}',${id||0})">Salvar conta</button></div>`)}
function saveAccount(type,id){let party=document.getElementById('accparty').value.trim(),desc=document.getElementById('accdesc').value.trim(),value=Number(document.getElementById('accvalue').value)||0,dueDate=document.getElementById('accdate').value,method=document.getElementById('accmethod').value,category=document.getElementById('acccat').value,note=document.getElementById('accnote').value.trim(),file=document.getElementById('accfile')?.files?.[0];if(!party||!desc||!value||!dueDate){toast('Preencha nome, descrição, valor e vencimento.');return}let arr=type==='payable'?db.payables:db.receivables;let x=id?arr.find(a=>a.id===id):null;let finish=(attachment)=>{let data={description:desc,value,dueDate,method,category,note,attachmentName:attachment?.name||x?.attachmentName||'',attachmentType:attachment?.type||x?.attachmentType||'',attachmentData:attachment?.data||x?.attachmentData||''};if(x)Object.assign(x,data,type==='payable'?{supplier:party}:{client:party});else arr.push({id:Date.now(),...data,status:'pending',...(type==='payable'?{supplier:party}:{client:party})});save();closeModal();toast(id?'Conta atualizada.':'Conta cadastrada.');render()};if(file){let r=new FileReader();r.onload=()=>finish({name:file.name,type:file.type,data:r.result});r.readAsDataURL(file)}else finish(null)}

function editAccount(type,id){openAccount(type,id)}
function completeAccount(type,id){let arr=type==='payable'?db.payables:db.receivables,x=arr.find(a=>a.id===id);if(!x)return;if(type==='payable'&&x.method==='Cartão de Crédito'){x.status='paid';x.completedAt=new Date().toLocaleString('pt-BR');x.creditCardSettled=true;x.costRecognized=false;x.cardInvoiceId=x.cardInvoiceId||('CC-'+new Date().toISOString().slice(0,7));db.cardInvoices=db.cardInvoices||[];let inv=db.cardInvoices.find(i=>i.id===x.cardInvoiceId);if(!inv){inv={id:x.cardInvoiceId,description:'Fatura cartão '+monthLabel(monthKey(x.dueDate)),total:0,status:'open',dueDate:x.dueDate};db.cardInvoices.push(inv)}if(!x.linkedToInvoice){inv.total+=Number(x.value||0);x.linkedToInvoice=true}x.note=(x.note?x.note+' | ':'')+'Vinculada à fatura '+inv.id+'; não duplicar no custo ao lançar a fatura global.';save();toast('Conta liquidada e vinculada à fatura do cartão, sem duplicidade.');render();return}x.status=type==='payable'?'paid':'received';x.completedAt=new Date().toLocaleString('pt-BR');x.costRecognized=type==='payable';save();toast(type==='payable'?'Conta marcada como paga.':'Recebimento confirmado.');render()}
function deleteAccount(type,id){let arr=type==='payable'?db.payables:db.receivables,x=arr.find(a=>a.id===id);if(!x)return;if(!confirm('Excluir este lançamento?'))return;arr.splice(arr.indexOf(x),1);save();toast('Lançamento excluído.');render()}

function exportCSV(){let rows=[['TIPO','Pessoa','Descricao','Vencimento','Valor','Categoria','Forma','Status','FaturaCartao']];db.payables.forEach(x=>rows.push(['A PAGAR',x.supplier,x.description,x.dueDate,x.value,x.category,x.method,x.status,x.cardInvoiceId||'']));db.receivables.forEach(x=>rows.push(['A RECEBER',x.client,x.description,x.dueDate,x.value,x.category,x.method,x.status,'']));db.orders.forEach(o=>{let x=orderCalc(o);rows.push(['COMANDA',o.client,'Servicos',o.closedAt||'',x.net,'Comanda',o.payment,x.profit])});let csv=rows.map(r=>r.join(';')).join('\\n');let a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='ED_DU_financeiro.csv';a.click();toast('Relatório exportado.')}

 <div class=summary><h3>5. Confirmar atendimento</h3><p>${b.items.length?b.items.map(i=>svc(i.serviceId)?.n).filter(Boolean).join(' + '):'Adicione pelo menos um serviço'} • ${b.prof||'Escolha o profissional'} • ${b.date||'Escolha a data'} • ${b.time||'Escolha a hora'}</p><button class="btn primary" onclick="submitBooking()">Enviar solicitação</button></div></div></div></main>${clientBottom()}`}
function openBookingServicePicker(){let selected=new Set((booking.items||[]).map(i=>i.serviceId));let options=SERVICES.map(s=>`<button class=service-pick type=button onclick="addBookingService(${s.id});closeModal()" ${selected.has(s.id)?'disabled':''}><b>${s.icon} ${esc(s.n)}</b><small>${money(s.base)} • ${money(s.long)} longo${selected.has(s.id)?' • já adicionado':''}</small></button>`).join('');showModal('Adicionar serviços',`<p class=muted>Escolha quantos serviços quiser. Os serviços já adicionados ficam bloqueados para evitar duplicidade.</p><div class=service-picker>${options}</div><br><div class=actions><button class="btn outline" onclick="closeModal()">Concluir</button></div>`)}

function submitBooking(){if(!booking.items?.length||!booking.prof||!booking.date||!booking.time){toast('Adicione serviços e complete profissional, data e hora.');return}let first=svc(booking.items[0].serviceId);db.requests.unshift({id:Date.now(),clientId:1,client:db.clients[0].name,serviceId:first.id,service:first.n,services:booking.items.map(i=>({...i,name:svc(i.serviceId).n})),prof:booking.prof,date:booking.date,time:booking.time,status:'Pendente'});save();toast('Solicitação enviada com todos os serviços.');app.clientPage='appointments';render()}

function clientAppointments(){let r=db.requests.find(x=>x.clientId===1)||null;return `${header()}<main><div class=client-shell><div class=page-head><div><h1>Meus agendamentos</h1><p>Acompanhe seu atendimento.</p></div></div><div class=card>${r?`<h2>${esc(r.client)}</h2><p>${esc(r.prof)} • ${r.date.split('-').reverse().join('/')} • ${r.time}</p><div class=service-chips>${(r.services||[{name:r.service}]).map(s=>`<span class=badge>${esc(s.name)}</span>`).join(' ')}</div><br><span class="badge ${r.status==='Aprovado'?'ok':'warn'}">${esc(r.status)}</span><br><br><div class=actions><button class=btn onclick="cgo('book')">Alterar agendamento</button><button class="btn danger" onclick="toast('Solicitação de cancelamento registrada.')">Solicitar cancelamento</button></div>`:'<p class=muted>Nenhum agendamento encontrado.</p>'}</div></div></main>`}
function clientPayments(){let list=db.orders.filter(o=>o.clientId===1&&!o.open);return `${header()}<main><div class=client-shell><div class=page-head><div><h1>Pagamentos</h1><p>Confira suas comandas e pague quando o salão liberar o pagamento.</p></div></div>${list.length?list.map(o=>{let x=orderCalc(o);let status=o.payment==='paid'?'Pago':'Aguardando pagamento';return `<div class="card payment-card" style="margin-bottom:12px"><div class=payment-hero><small>Total da comanda</small><strong>${money(x.net)}</strong></div><br><div class=page-head style="margin-bottom:8px"><div><h2>${esc(o.client)}</h2><span class="badge ${o.payment==='paid'?'ok':'warn'}">${status}</span></div></div><p class=muted>${(o.items||[]).map(i=>svc(i.serviceId)?.n).filter(Boolean).join(' • ')||'Serviços não informados'}</p><div class=summary><div class=summary-row><span>Desconto</span><b>${money(x.discount)}</b></div><div class=summary-row><span>Fidelidade</span><b>${Math.floor(x.net/10)} pts</b></div></div><br><div class=command-actions><button class="btn outline" onclick="viewClientOrder(${o.id})">Ver comanda</button>${o.payment!=='paid'?'<button class="btn primary" onclick="clientPayOrder('+o.id+')">Pagar agora</button>':'<button class="btn outline" onclick="viewClientOrder('+o.id+')">Ver comprovante</button>'}</div></div>`}).join(''):'<div class=card><p class=muted>Nenhuma comanda fechada disponível para pagamento.</p></div>'}</div></main>${clientBottom()}`}

function viewClientOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let x=orderCalc(o);showModal('Sua comanda',`<div class=summary-box><p><b>Atendimento</b></p><div class=command-services>${(o.items||[]).map(i=>{let s=svc(i.serviceId);return `<div class=command-service><span>${esc(s.n)} <small class=muted>${i.length==='long'?'Longo':'Base'}</small></span><b>${money(i.length==='long'?s.long:s.base)}</b></div>`}).join('')}</div><hr><div class=summary-row><span>Subtotal</span><b>${money(x.sub)}</b></div><div class=summary-row><span>Desconto</span><b>- ${money(x.discount)}</b></div><div class=summary-row total><span>Total</span><b>${money(x.net)}</b></div><div class=summary-row><span>Status</span><b>${o.payment==='paid'?'Pago':'Aguardando pagamento'}</b></div></div><br><div class=command-actions><button class="btn outline" onclick="closeModal()">Fechar</button>${o.payment!=='paid'?`<button class="btn primary" onclick="clientPayOrder(${o.id})">Pagar agora</button>`:''}</div>`)}
function clientPayOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;let methods=o.allowedPayments||db.settings.paymentMethods||[];showModal('Pagamento',`<div class=summary-box><div class=summary-row total><span>Total</span><b>${money(orderCalc(o).net)}</b></div></div><br><p class=muted>Formas liberadas pelo salão para esta comanda:</p><div class=pay-method-grid>${methods.map(m=>`<button type=button class="pay-method" onclick="finishClientPayment(${id},'${m.replace(/'/g,"\'")}')">${esc(m)}</button>`).join('')}</div><br><div class=actions><button class="btn outline" onclick="closeModal()">Cancelar</button></div>`)}
function finishClientPayment(id,method){let o=db.orders.find(x=>x.id===id);if(!o)return;o.paymentMethod=method;o.payment='paid';o.paidAt=new Date().toLocaleString('pt-BR');o.paymentConfirmed=true;save();closeModal();toast('Pagamento registrado com sucesso.');app.clientPage='payments';render()}

function payDemo(id){markPaid(id);toast('Pagamento de teste confirmado.');app.clientPage='payments';render()}
function render(){try{if(app.role==='pro')pro();else document.getElementById('root').innerHTML=client()}catch(e){console.error(e);document.getElementById('root').innerHTML='<div style="padding:30px;font-family:system-ui"><h2>ED & DU</h2><p>O sistema encontrou um erro interno. Recarregue para continuar.</p></div>'}}
function safeRender(){try{render()}catch(e){console.error(e);document.getElementById('root').innerHTML='<div style=\"min-height:100vh;display:grid;place-items:center;padding:28px;background:#f4f2ee;font-family:Arial,sans-serif\"><div style=\"max-width:620px;background:white;border:1px solid #e6e1d9;border-radius:20px;padding:28px\"><b>ED & DU | Terapia da Beleza</b><h1>Aplicação pronta para teste</h1><p>O aplicativo carregou, mas ocorreu um erro interno. Recarregue a página para tentar novamente.</p></div></div>'}}
safeRender();
</script>
